<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IOLSTAR Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface2:#EAF0F2; --ink:#12232B; --muted:#586A72; --line:#D8E2E6;
  --accent:#0A6C7E; --accent-ink:#FFFFFF; --accent-soft:#DCEFF3; --series2:#D18A1F;
  --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#8F5400; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#FADAD7;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1317; --surface:#131D23; --surface2:#1B2830; --ink:#E4EDF0; --muted:#8FA3AC; --line:#26353D;
  --accent:#4DBBCD; --accent-ink:#06222A; --accent-soft:#143640; --series2:#E7A94B;
  --ok:#5CCB93; --ok-soft:#133526; --warn:#F0B35A; --warn-soft:#3A2A0E; --bad:#FF8A80; --bad-soft:#41191A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1317; --surface:#131D23; --surface2:#1B2830; --ink:#E4EDF0; --muted:#8FA3AC; --line:#26353D;
  --accent:#4DBBCD; --accent-ink:#06222A; --accent-soft:#143640; --series2:#E7A94B;
  --ok:#5CCB93; --ok-soft:#133526; --warn:#F0B35A; --warn-soft:#3A2A0E; --bad:#FF8A80; --bad-soft:#41191A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h2{font-size:17px}h3{font-size:14px}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.wrap{max-width:1180px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 20px;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:15px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.who img{width:24px;height:24px;border-radius:50%}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs a:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h3{margin-bottom:10px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.sect-h p{margin:2px 0 0;color:var(--muted)}

.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>input,label.f>select,label.f>textarea{font-size:14px;color:var(--ink)}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.ck input{width:16px;height:16px;padding:0}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.alerts{border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--surface);border-radius:8px;padding:14px 16px}
.alerts.warn{border-left-color:var(--warn)}
.alert-i{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
.alert-i:first-of-type{border-top:0}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.chart .capl{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:200px 1fr 90px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hb .t{background:var(--surface2);height:10px;border-radius:5px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent)}
@media(max-width:520px){.hb{grid-template-columns:120px 1fr 70px}}
details.grp{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 14px}
details.grp+details.grp{margin-top:10px}
details.grp summary{cursor:pointer;font-weight:600;list-style-position:inside}
.dist{margin:8px 0 0 0;padding:0;list-style:none}
.dist li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.dist li:first-child{border-top:0}
.dist .m{font-weight:600;margin-top:10px}
.dist .m:first-child{margin-top:4px}

.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 20px;text-align:center;background:var(--surface)}
.empty p{max-width:56ch;margin:6px auto 14px;color:var(--muted)}
.center{min-height:55vh;display:grid;place-items:center;text-align:center}
.center>div{max-width:52ch}

.mback{position:fixed;inset:0;background:rgba(5,12,16,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 24px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(780px,100%);padding:18px;margin:auto 0}
.modal h2{margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.irow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr)) auto;gap:8px;align-items:end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.idet{display:contents}
.irow .btn{align-self:end;margin-bottom:1px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sgrid label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.sgrid input{font-family:var(--mono);width:100%}
.perm-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 16px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;max-width:90vw}
#toast.err{background:var(--bad);color:#fff}
.tabs2{display:flex;gap:4px;flex-wrap:wrap}
.tabs2 button{font:inherit;padding:4px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
</style>

<div class="top"><div class="top-in" id="topbar"></div></div>
<main class="wrap" id="app"><div class="center"><div><h2>IOLSTAR Panel yükleniyor</h2><p class="muted">Hesabınız ve veriler kontrol ediliyor.</p></div></div></main>
<div id="modal"></div>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=new Intl.NumberFormat('tr-TR');
var CURS=['EUR','USD','TRY'];
function money(v,c){try{return new Intl.NumberFormat('tr-TR',{style:'currency',currency:c||'EUR',maximumFractionDigits:0}).format(v||0)}catch(e){return nf.format(v||0)+' '+c}}
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){if(!s||typeof s!=='string')return null;var p=s.split('-').map(Number);if(p.length!==3||p.some(isNaN))return null;return new Date(p[0],p[1]-1,p[2])};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var diffDays=function(a,b){return Math.round((a-b)/864e5)};
var fmtD=function(s){var d=typeof s==='string'?parse(s):s;return d?d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'};
var fmtS=function(d){return pad(d.getDate())+'.'+pad(d.getMonth()+1)};
var TODAY=parse(iso(new Date()));

var BRANDS=['Zaraccom','IOLStar','HP51'];
var DPTS=[];for(var di=0;di<=80;di++)DPTS.push((di/2).toFixed(1));
var pLabel=function(k){return Number(k).toLocaleString('tr-TR',{minimumFractionDigits:1,maximumFractionDigits:1})+' D'};
var TYPE_NAME={mamul:'Bitmiş lens',yarimamul:'Yarımamül',hammadde:'Hammadde',kalip:'Kalıp'};
var TYPES=[['mamul','Bitmiş lens'],['yarimamul','Yarımamül'],['hammadde','Hammadde'],['kalip','Kalıp (satışa kapalı)']];

var PERMS=[['dash','Özeti görüntüle'],['prod_view','Ürün ve stoğu görüntüle'],['prod_edit','Ürün, model ve stok düzenle'],['ord_view','Siparişleri görüntüle'],['ord_edit','Sipariş ekle ve düzenle'],['plan_view','Üretim planı ve kapasiteyi görüntüle'],['plan_edit','Kapasite değerlerini değiştir'],['fin_view','Gelir ve faturaları görüntüle'],['fin_edit','Fatura ve ödeme işle']];
var ROLES={
  'Yönetici':PERMS.map(function(p){return p[0]}),
  'Satış':['dash','prod_view','ord_view','ord_edit','plan_view'],
  'Üretim':['dash','prod_view','prod_edit','ord_view','plan_view','plan_edit'],
  'Muhasebe':['dash','ord_view','fin_view','fin_edit'],
  'İzleyici':['dash','prod_view','ord_view','plan_view']
};
var STATUS=[['alındı','Alındı','neutral'],['üretimde','Üretimde','accent'],['sevk','Sevk edildi','ok'],['iptal','İptal','neutral']];
var STAT=Object.fromEntries(STATUS.map(function(s){return [s[0],s]}));
var PRIO=[['acil','Acil'],['normal','Normal'],['düşük','Düşük']];
var PR={'acil':0,'normal':1,'düşük':2};
var DEF_ST={capacity:1500,sterilDays:3,packCapacity:1500,shipDays:3,workdays:[1,2,3,4,5],holidays:'',useStock:false};

var S={db:null,user:null,uid:null,isOwner:false,me:null,models:{},stock:{},orders:{},invoices:{},acl:{},requests:{},settings:{},loaded:{},err:null,cur:null,sel:null,invF:'open',ordF:'aktif',names:{},slow:false};
var P=new Set();
var raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render()})}
function toast(m,err){var t=$('#toast');t.textContent=m;t.className=err?'err':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3600)}
async function save(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){toast('Kaydedilemedi'+(e&&e.code?' ('+e.code+')':'')+'. Bu işlem için yetkiniz olmayabilir.',true);return false}}

/* ---------- models ---------- */
function mList(){return Object.keys(S.models).map(function(id){return Object.assign({id:id},S.models[id])}).filter(function(m){return m.active!==false}).sort(function(a,b){var ba=BRANDS.indexOf(a.brand),bb=BRANDS.indexOf(b.brand);if(ba!==bb)return (ba<0?9:ba)-(bb<0?9:bb);return (a.ord||99)-(b.ord||99)})}
function mGet(id){var m=S.models[id];return m?Object.assign({id:id},m):null}
function isGram(m){return !!(m&&m.unit==='g')}
function isLens(m){return !!(m&&m.type==='mamul')}
function detailOf(it){var p=[];if(it.color)p.push(it.color);if(it.cyl)p.push('silindir '+it.cyl);if(it.power)p.push(pLabel(it.power));return p.join(' · ')}
function itemName(it){var m=mGet(it.model);return m?(m.brand?m.brand+' › ':'')+m.name:(it.model||'—')}
function itemText(it){var m=mGet(it.model),d=detailOf(it);return itemName(it)+(d?' · '+d:'')+' × '+nf.format(it.qty||0)+(isGram(m)?' g':'')}
function totalQty(o){return (o.items||[]).filter(function(i){return !isGram(mGet(i.model))}).reduce(function(a,i){return a+(+i.qty||0)},0)}
function gramsOf(o){return (o.items||[]).filter(function(i){return isGram(mGet(i.model))}).reduce(function(a,i){return a+(+i.qty||0)},0)}
function skey(it){return [it.color||'',it.cyl||'',it.power||''].join('|')}
function ordList(){return Object.keys(S.orders).map(function(id){return Object.assign({id:id},S.orders[id])})}
function openOrders(){return ordList().filter(function(o){return ['sevk','iptal'].indexOf(o.status)<0})}

/* ---------- settings, dates, planner ---------- */
function st(){
  var s=S.settings||{};var n=function(v,d){return v==null||v===''?d:+v};
  return {capacity:Math.max(0,n(s.capacity,DEF_ST.capacity)),sterilDays:Math.max(0,n(s.sterilDays,DEF_ST.sterilDays)),packCapacity:Math.max(0,n(s.packCapacity,DEF_ST.packCapacity)),shipDays:Math.max(0,n(s.shipDays,DEF_ST.shipDays)),workdays:Array.isArray(s.workdays)&&s.workdays.length?s.workdays:DEF_ST.workdays,holidays:s.holidays||'',useStock:!!s.useStock};
}
function holidaySet(){return new Set((st().holidays||'').split(/[\s,;]+/).filter(Boolean))}
function isWork(d,H){return st().workdays.indexOf(d.getDay())>=0&&!H.has(iso(d))}
function nextWork(d,H){var x=new Date(d),n=0;while(!isWork(x,H)&&n<400){x=addDays(x,1);n++}return x}
function addWorkDays(d,n,H){var x=new Date(d),c=0;while(c<n){x=nextWork(addDays(x,1),H);c++}return x}
function computePlan(){
  var s=st(),H=holidaySet();
  var q=ordList().filter(function(o){return ['alındı','üretimde'].indexOf(o.status)>=0&&(o.items||[]).some(function(i){return isLens(mGet(i.model))})});
  q.sort(function(a,b){
    var ra=a.status==='üretimde'?0:1,rb=b.status==='üretimde'?0:1;if(ra!==rb)return ra-rb;
    var pa=PR[a.priority]==null?1:PR[a.priority],pb=PR[b.priority]==null?1:PR[b.priority];if(pa!==pb)return pa-pb;
    var da=a.requestedDate||'9999',db=b.requestedDate||'9999';if(da!==db)return da<db?-1:1;
    return (a.orderDate||'')<(b.orderDate||'')?-1:1});
  var left={};if(s.useStock)Object.keys(S.stock).forEach(function(id){left[id]=Object.assign({},(S.stock[id]||{}).powers||{})});
  var jobs=q.map(function(o){
    var need=0;
    (o.items||[]).forEach(function(it){if(!isLens(mGet(it.model)))return;var n=+it.qty||0;
      if(s.useStock&&left[it.model]){var k=skey(it),a=Math.min(n,+left[it.model][k]||0);left[it.model][k]=(+left[it.model][k]||0)-a;n-=a}
      need+=n});
    need=Math.max(0,need-(+o.doneQty||0));
    return {o:o,need:need,left:need,packed:0,prodStart:null,prodEnd:null,packEnd:null};
  });
  var res={jobs:jobs,prodLoads:{},packLoads:{},H:H,ok:s.capacity>0&&s.packCapacity>0,backlog:jobs.reduce(function(a,j){return a+j.need},0),endDay:null,rows:[]};
  if(!res.ok){res.rows=jobs.map(function(j){return {o:j.o,need:j.need,prodStart:null,prodEnd:null,packEnd:null,sug:null,late:null}});return res}
  /* Akış: üretim (günlük cap) → her parti için sterilizasyon (iş günü) → ikincil paketleme (günlük packCap) → sevkiyat */
  var ready=[],day=nextWork(TODAY,H),guard=0;
  var pending=function(){return jobs.some(function(j){return j.left>0})||ready.length>0};
  while(pending()&&guard++<3000){
    var dk=iso(day),room=s.capacity;
    for(var i=0;i<jobs.length&&room>0;i++){var j=jobs[i];if(j.left<=0)continue;
      var t=Math.min(j.left,room);j.left-=t;room-=t;
      if(!j.prodStart)j.prodStart=day;
      res.prodLoads[dk]=(res.prodLoads[dk]||0)+t;
      if(j.left<=0){
        j.prodEnd=day;
        /* sipariş partisi tamamlanınca tek parti olarak sterilizasyona girer */
        ready.push({j:j,qty:j.need,at:addWorkDays(day,s.sterilDays,H)});
      }
    }
    var proom=s.packCapacity;
    ready.sort(function(a,b){return a.at-b.at});
    for(var r=0;r<ready.length&&proom>0;r++){var e=ready[r];if(e.at>day||e.qty<=0)continue;
      var u=Math.min(e.qty,proom);e.qty-=u;proom-=u;e.j.packed+=u;
      res.packLoads[dk]=(res.packLoads[dk]||0)+u;
      if(e.j.packed>=e.j.need&&!e.j.packEnd)e.j.packEnd=day;
    }
    ready=ready.filter(function(e){return e.qty>0});
    day=nextWork(addDays(day,1),H);
  }
  res.rows=jobs.map(function(j){
    var endD=j.need>0?j.packEnd:null;
    var sug=endD?nextWork(addDays(endD,s.shipDays),H):null;
    var req=parse(j.o.requestedDate);
    var late=(sug&&req)?diffDays(sug,req):null;
    if(endD&&(!res.endDay||endD>res.endDay))res.endDay=endD;
    return {o:j.o,need:j.need,prodStart:j.prodStart,prodEnd:j.prodEnd,packEnd:endD,sug:sug,late:late};
  });
  return res;
}

/* ---------- invoices ---------- */
function invList(){
  return Object.keys(S.invoices).map(function(id){var v=Object.assign({id:id},S.invoices[id]);
    var out=(+v.amount||0)-(+v.paid||0),due=parse(v.dueDate),days=due?diffDays(due,TODAY):null,stt='open';
    if(out<=0)stt='paid';else if(days!=null&&days<0)stt='overdue';else if(days===0)stt='today';else if(days!=null&&days<=7)stt='soon';
    v.out=Math.max(0,out);v.days=days;v.st=stt;return v}).sort(function(a,b){return (a.dueDate||'9')<(b.dueDate||'9')?-1:1});
}
function invPill(v){
  if(v.st==='paid')return '<span class="pill ok">Ödendi</span>';
  if(v.st==='overdue')return '<span class="pill bad">'+(-v.days)+' gün gecikti</span>';
  if(v.st==='today')return '<span class="pill warn">Bugün vade</span>';
  if(v.st==='soon')return '<span class="pill warn">'+v.days+' gün kaldı</span>';
  return '<span class="pill">'+(v.days==null?'Vadesiz':v.days+' gün kaldı')+'</span>';
}

/* ---------- charts ---------- */
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v)));var f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function barChart(o){
  var W=720,H=o.h||230,m={l:54,r:10,t:12,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var n=o.labels.length,ns=o.series.length;
  var flat=[].concat.apply([],o.series);
  var max=niceMax(Math.max(o.line||0,Math.max.apply(null,flat.concat([1]))));
  var gw=iw/n,bw=Math.min(30,(gw*.72)/ns);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  for(var i=0;i<=4;i++){var v=max*i/4,y=m.t+ih-ih*i/4;s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(m.l-6)+'" y="'+(y+4)+'" text-anchor="end">'+esc(o.yfmt?o.yfmt(v):nf.format(Math.round(v)))+'</text>'}
  o.labels.forEach(function(l,i){
    var cx=m.l+gw*i+gw/2;
    o.series.forEach(function(ser,k){var v=ser[i]||0,bh=ih*v/max,x=cx-bw*ns/2+bw*k;
      s+='<rect x="'+x.toFixed(1)+'" y="'+(m.t+ih-bh).toFixed(1)+'" width="'+Math.max(1,bw-(bw>6?2:0)).toFixed(1)+'" height="'+Math.max(bh,0).toFixed(1)+'" rx="'+(bw>6?2:0)+'" style="fill:'+o.colors[k]+'"><title>'+esc(l+': '+(o.tfmt?o.tfmt(v):nf.format(v)))+'</title></rect>'});
    if(!o.every||i%o.every===0)s+='<text class="ax" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>'});
  if(o.line){var y=m.t+ih-ih*o.line/max;s+='<line class="capl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(W-m.r)+'" y="'+(y-5)+'" text-anchor="end" style="fill:var(--bad)">'+esc(o.lineLabel||'')+'</text>'}
  return s+'</svg>';
}
function capChart(plan){
  if(!plan.ok)return '<p class="muted small" style="margin:0">Üretim ve paketleme kapasitesi girilmedi. Kapasite sekmesinden girin.</p>';
  var H=plan.H,d=nextWork(TODAY,H),labels=[],pr=[],pk=[];
  for(var i=0;i<14;i++){labels.push(fmtS(d));pr.push(plan.prodLoads[iso(d)]||0);pk.push(plan.packLoads[iso(d)]||0);d=nextWork(addDays(d,1),H)}
  return '<div class="legend"><span><i style="background:var(--accent)"></i>Üretim (adet)</span><span><i style="background:var(--series2)"></i>Paketleme (adet)</span></div>'+
    barChart({labels:labels,series:[pr,pk],colors:['var(--accent)','var(--series2)'],aria:'Önümüzdeki 14 iş günü üretim ve paketleme adedi',every:1,tfmt:function(v){return nf.format(v)+' adet'}});
}
function revChart(c){
  var months=[],i;for(i=5;i>=0;i--){var d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  var L=invList().filter(function(v){return v.currency===c});
  var a=months.map(function(m){return L.filter(function(v){return (v.issueDate||'').slice(0,7)===m}).reduce(function(s,v){return s+(+v.amount||0)},0)});
  var b=months.map(function(m){return L.filter(function(v){return (v.paidDate||'').slice(0,7)===m}).reduce(function(s,v){return s+(+v.paid||0)},0)});
  var tr=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  var yf=function(v){return v>=1e6?(v/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' Mn':v>=1e3?nf.format(Math.round(v/1e3))+' B':nf.format(Math.round(v))};
  return '<div class="legend"><span><i style="background:var(--accent)"></i>Faturalanan</span><span><i style="background:var(--series2)"></i>Tahsil edilen</span></div>'+
    barChart({labels:months.map(function(m){return tr[+m.slice(5)-1]}),series:[a,b],colors:['var(--accent)','var(--series2)'],yfmt:yf,tfmt:function(v){return money(v,c)},aria:'Son 6 ay faturalanan ve tahsil edilen gelir, '+c});
}

/* ---------- permissions ---------- */
function computePerms(){
  if(S.isOwner)return new Set(PERMS.map(function(p){return p[0]}));
  return new Set(['dash','prod_view','ord_view','plan_view','fin_view']);
}
function roleOf(){return S.isOwner?'Yönetici':'Görüntüleyici'}
var TABS=[['ozet','Özet','dash'],['siparis','Siparişler','ord_view'],['plan','Üretim Planı','plan_view'],['kapasite','Kapasite','plan_view'],['urun','Ürün ve Stok','prod_view'],['gelir','Gelir ve Faturalar','fin_view']];
function allowedTabs(){return TABS.filter(function(t){return t[2]==='#owner'?S.isOwner:P.has(t[2])})}
function curTab(){var h=(location.hash||'').replace('#','');var a=allowedTabs();var f=a.filter(function(t){return t[0]===h})[0];return f?f[0]:(a[0]?a[0][0]:'')}

/* ---------- views ---------- */
function curCur(){if(S.cur)return S.cur;var l=invList()[0];return l&&l.currency||'EUR'}
function kpi(l,v,s,tone){return '<div class="card kpi '+(tone||'')+'"><div class="l">'+esc(l)+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':'')+'</div>'}
function curTabs(){var c=curCur();return '<div class="tabs2" role="group" aria-label="Para birimi">'+CURS.map(function(x){return '<button type="button" data-act="cur" data-v="'+x+'" aria-pressed="'+(x===c)+'">'+x+'</button>'}).join('')+'</div>'}

function alertsHtml(){
  if(!P.has('fin_view'))return '';
  var L=invList().filter(function(v){return v.st==='overdue'||v.st==='today'||v.st==='soon'});
  if(!L.length)return '';
  var od=L.filter(function(v){return v.st==='overdue'}).length;
  var h='<section class="alerts'+(od?'':' warn')+'" aria-label="Ödeme uyarıları"><div class="row sb"><h3 style="margin:0">Ödeme uyarıları</h3><span class="small muted">'+od+' vadesi geçmiş · '+(L.length-od)+' yaklaşan (7 gün)</span></div>';
  L.slice(0,8).forEach(function(v){
    h+='<div class="alert-i"><div style="min-width:0"><b>'+esc(v.customer||'—')+'</b> <span class="muted small">Fatura '+esc(v.no||v.id)+' · vade '+fmtD(v.dueDate)+'</span></div><div class="row" style="gap:10px"><span class="num">'+money(v.out,v.currency)+'</span>'+invPill(v)+(P.has('fin_edit')?'<button class="btn sm" data-act="pay-inv" data-id="'+esc(v.id)+'">Ödendi</button>':'')+'</div></div>'});
  if(L.length>8)h+='<div class="small muted" style="padding-top:6px">Diğer '+(L.length-8)+' uyarı için Gelir ve Faturalar sekmesine bakın.</div>';
  return h+'</section>';
}
function groupOpen(){
  var g={};
  openOrders().forEach(function(o){(o.items||[]).forEach(function(it){var m=mGet(it.model);if(!m)return;
    var b=m.brand||'Diğer';g[b]=g[b]||{};var mm=g[b][m.id]=g[b][m.id]||{m:m,total:0,det:{}};
    var d=detailOf(it)||'Genel';mm.total+=+it.qty||0;mm.det[d]=(mm.det[d]||0)+(+it.qty||0);});});
  return g;
}
function distHtml(){
  var g=groupOpen(),brands=Object.keys(g).sort(function(a,b){return (BRANDS.indexOf(a)<0?9:BRANDS.indexOf(a))-(BRANDS.indexOf(b)<0?9:BRANDS.indexOf(b))});
  if(!brands.length)return '<p class="muted small" style="margin:0">Açık sipariş yok.</p>';
  return brands.map(function(b){
    return '<details class="grp" open><summary>'+esc(b)+'</summary>'+Object.keys(g[b]).map(function(id){
      var mm=g[b][id],isG=isGram(mm.m);
      var rows=Object.keys(mm.det).sort(function(x,y){return x.localeCompare(y,'tr')}).map(function(d){return '<li><span>'+esc(d)+'</span><span class="num">'+nf.format(mm.det[d])+(isG?' g':' adet')+'</span></li>'}).join('');
      return '<div class="m">'+esc(mm.m.name)+' · '+esc(TYPE_NAME[mm.m.type]||'')+' · toplam <span class="num">'+nf.format(mm.total)+(isG?' g':' adet')+'</span></div><ul class="dist">'+rows+'</ul>';
    }).join('')+'</details>';
  }).join('');
}
function emptyState(){
  return '<div class="empty"><h2>Henüz sipariş yok</h2><p>Ürün kataloğu hazır. Müşteriden sipariş geldiğinde marka, model ve dioptri seçerek ekleyin; Gmail\'e gelen siparişleri de Claude işleyebilir.</p><div class="row" style="justify-content:center">'+
    (P.has('ord_edit')?'<button class="btn p" data-act="new-order">Sipariş ekle</button>':'')+'</div></div>';
}

  var plan=computePlan(),h='<div class="stack">';
  h+=alertsHtml();
  if(!Object.keys(S.orders).length&&!Object.keys(S.invoices).length)h+=emptyState();
  if(P.has('ord_view')||P.has('plan_view')){
    var late=plan.rows.filter(function(r){return r.late!=null&&r.late>0}).length;
    var grams=openOrders().reduce(function(a,o){return a+gramsOf(o)},0);
    h+='<div class="grid kpis">'+
      kpi('Açık sipariş',nf.format(openOrders().length),'teslim edilmemiş')+
      kpi('Üretilecek bitmiş lens',nf.format(plan.backlog),'adet (kalan)')+
      kpi('Son paketleme',plan.endDay?fmtD(plan.endDay):'—',plan.ok?'tüm siparişler paketlenince':'kapasite girilmedi',plan.ok?'':'warn')+
      kpi('Teslim riski',nf.format(late),'istenen tarihi aşan sipariş',late?'bad':'')+
      kpi('Hammadde siparişi',nf.format(grams),'gram (açık)')+'</div>';
  }
  if(P.has('fin_view')){
    var c=curCur(),L=invList().filter(function(v){return v.currency===c}),ym=iso(TODAY).slice(0,7);
    var inv=L.filter(function(v){return (v.issueDate||'').slice(0,7)===ym}).reduce(function(a,v){return a+(+v.amount||0)},0);
    var col=L.filter(function(v){return (v.paidDate||'').slice(0,7)===ym}).reduce(function(a,v){return a+(+v.paid||0)},0);
    var out=L.reduce(function(a,v){return a+v.out},0),od=L.filter(function(v){return v.st==='overdue'}).reduce(function(a,v){return a+v.out},0);
    h+='<div class="row sb"><h3 style="margin:0">Gelir ('+esc(c)+')</h3>'+curTabs()+'</div><div class="grid kpis">'+
      kpi('Bu ay faturalanan',money(inv,c),'')+kpi('Bu ay tahsil edilen',money(col,c),'')+kpi('Açık alacak',money(out,c),'')+kpi('Vadesi geçen',money(od,c),'',od?'bad':'')+'</div>';
  }
  h+='<div class="grid two">';
  if(P.has('plan_view'))h+='<section class="card"><h3>Önümüzdeki 14 iş günü üretim ve paketleme</h3>'+capChart(plan)+'</section>';
  if(P.has('fin_view'))h+='<section class="card"><h3>Aylık gelir ('+esc(curCur())+')</h3>'+revChart(curCur())+'</section>';
  h+='</div>';
  if(P.has('ord_view'))h+='<section class="card"><h3>Açık siparişler · marka ve model</h3>'+distHtml()+'</section>';
  return h+'</div>';
}

function viewGelir(){

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.dataset.act,id=el.dataset.id;
  if(a==='mclose-bg'){if(e.target===el)closeModal();return}
  if(el.tagName==='SELECT'||el.tagName==='INPUT')return;
  if(a==='mclose')closeModal();
  else if(a==='cur'){S.cur=el.dataset.v;schedule()}
  else if(a==='new-order')orderForm();
  else if(a==='edit-order')orderForm(id);
  else if(a==='new-inv')invForm();
  else if(a==='edit-inv')invForm(id);
  else if(a==='pay-inv')payForm(id);
  else if(a==='new-model')modelForm();
  else if(a==='edit-model')modelForm(id);
  else if(a==='edit-stock')stockForm(id);
  else if(a==='sel-model'){S.sel=id;schedule()}
  else if(a==='add-row'){var f=mList().filter(function(m){return m.sellable!==false})[0];var d=document.createElement('div');d.innerHTML=itemRow({model:f?f.id:'',qty:''});$('#irows').appendChild(d.firstChild)}
  else if(a==='rm-row'){var r=el.closest('.irow');if(document.querySelectorAll('.irow').length>1)r.remove()}
  else if(a==='del-order'){if(!el.dataset.arm){el.dataset.arm='1';el.textContent='Silmek için tekrar basın';return}save(async function(){await S.db.doc('orders/'+id).delete();closeModal()},'Sipariş silindi')}
  else if(a==='del-inv'){if(!el.dataset.arm){el.dataset.arm='1';el.textContent='Silmek için tekrar basın';return}save(async function(){await S.db.doc('invoices/'+id).delete();closeModal()},'Fatura silindi')}
  else if(a==='prio-set')save(function(){return S.db.doc('orders/'+id).update({priority:el.dataset.v})});
  else if(a==='save-settings'){
    var wd=[].slice.call(document.querySelectorAll('[data-act="wd"]')).filter(function(c){return c.checked}).map(function(c){return +c.dataset.d});
    if(!wd.length){toast('En az bir çalışma günü seçin.',true);return}
    save(function(){return S.db.doc('settings/main').set({capacity:Math.max(0,+$('#s-cap').value||0),sterilDays:Math.max(0,+$('#s-ster').value||0),packCapacity:Math.max(0,+$('#s-pack').value||0),shipDays:Math.max(0,+$('#s-ship').value||0),workdays:wd,holidays:$('#s-hol').value,useStock:$('#s-stock').checked})},'Kapasite kaydedildi')}
});
document.addEventListener('change',function(e){
  var el=e.target,a=el.dataset&&el.dataset.act;
  if(el.classList.contains('ibrand')){var row=el.closest('.irow');var mv=modelOptsVal(el.value,'');row.querySelector('.imodel').innerHTML=modelOptsFor(el.value,'');row.querySelector('.idet').innerHTML=detailFields(mv,{});return}
  if(el.classList.contains('imodel')){var row2=el.closest('.irow');row2.querySelector('.idet').innerHTML=detailFields(el.value,{});return}
  if(a==='ordF'){S.ordF=el.value;schedule()}
  else if(a==='invF'){S.invF=el.value;schedule()}
  else if(a==='stock-sel'){var cc=$('#stockColor'),cyv=$('#stockCyl');stockForm(el.dataset.id,cc?cc.value:'',cyv?cyv.value:'')}
  else if(a==='status')save(function(){return S.db.doc('orders/'+el.dataset.id).update({status:el.value})});
  else if(a==='prio')save(function(){return S.db.doc('orders/'+el.dataset.id).update({priority:el.value})});
  else if(a==='role'){var f2=el.closest('form'),set=ROLES[el.value];if(set)f2.querySelectorAll('[name="perm"]').forEach(function(c){c.checked=set.indexOf(c.value)>=0})}
});
document.addEventListener('input',function(e){
  if(e.target.id==='ordQ'){var q=e.target.value.toLowerCase();document.querySelectorAll('#ordBody tr').forEach(function(r){r.hidden=!!q&&r.dataset.q.indexOf(q)<0})}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form,id=f.dataset.id,fd=new FormData(f),g=function(n){return (fd.get(n)||'').toString().trim()};
  if(k==='order'){
    var items=[].slice.call(f.querySelectorAll('.irow')).map(function(r){
      var mid=r.querySelector('.imodel').value,c=r.querySelector('.icolor'),cy=r.querySelector('.icyl'),dp=r.querySelector('.idpt');
      return {model:mid,color:c?c.value:'',cyl:cy?cy.value:'',power:dp?dp.value:'',qty:Math.max(0,Math.round(+r.querySelector('.iqty').value||0))};
    }).filter(function(i){return i.model&&i.qty>0});
    if(!items.length){toast('En az bir kalem, model ve adet/gram girin.',true);return}
    var d={customer:g('customer'),country:g('country'),orderDate:g('orderDate'),requestedDate:g('requestedDate'),priority:g('priority'),status:g('status'),amount:+g('amount')||0,currency:g('currency'),doneQty:+g('doneQty')||0,source:g('source'),note:g('note'),items:items};
    save(async function(){if(id)await S.db.doc('orders/'+id).set(d);else await S.db.collection('orders').add(d);closeModal()},'Sipariş kaydedildi')}
  else if(k==='inv'){
    var v={no:g('no'),customer:g('customer'),orderId:g('orderId'),amount:+g('amount')||0,currency:g('currency'),issueDate:g('issueDate'),dueDate:g('dueDate'),paid:+g('paid')||0,paidDate:g('paidDate'),source:g('source')};
    save(async function(){if(id)await S.db.doc('invoices/'+id).set(v);else await S.db.collection('invoices').add(v);closeModal()},'Fatura kaydedildi')}
  else if(k==='pay'){
    var inv=S.invoices[id];if(!inv)return;var amt=+g('amt')||0;
    save(async function(){await S.db.doc('invoices/'+id).update({paid:(+inv.paid||0)+amt,paidDate:g('date')});closeModal()},'Ödeme kaydedildi')}
  else if(k==='model'){
    var cols=g('colors').split(',').map(function(x){return x.trim()}).filter(Boolean);
    var cyls=g('cyl').split(',').map(function(x){return +x.trim()}).filter(function(x){return x>0});
    var type=g('type');
    var m={brand:g('brand'),name:g('name'),type:type,sellable:fd.get('sellable')!==null,active:fd.get('active')!==null,price:+g('price')||0,currency:g('currency')};
    if(fd.get('dpt')!==null)m.dpt={min:0,max:40,step:0.5};
    if(cols.length)m.colors=cols;
    if(cyls.length)m.cyl=cyls;
    if(type==='hammadde'){m.unit='g';m.porsiyon=+g('porsiyon')||250;m.sellable=true}
    save(async function(){
      if(id){await S.db.doc('models/'+id).set(Object.assign({ord:(S.models[id]||{}).ord||99},m))}
      else{var slug=(m.brand+'__'+m.name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');m.ord=mList().length+1;await S.db.doc('models/'+slug).set(m)}
      closeModal()},'Model kaydedildi')}
  else if(k==='stock'){
    var prefix=f.dataset.prefix||'';
    var pw=Object.assign({},stockPowers(id));
    Object.keys(pw).forEach(function(key){if(key.indexOf(prefix)===0)delete pw[key]});
    f.querySelectorAll('input[name="s"]').forEach(function(i){var n=Math.max(0,Math.round(+i.value||0));if(n)pw[prefix+(i.dataset.k||'')]=n});
    save(async function(){await S.db.doc('stock/'+id).set({powers:pw,updatedAt:new Date().toISOString()});closeModal()},'Stok kaydedildi')}
});
window.addEventListener('hashchange',function(){schedule();window.scrollTo(0,0)});

/* ---------- oturum ve veri (Supabase) ---------- */
var CFG=window.IOLSTAR_CONFIG||{};
var sb=(window.supabase&&CFG.supabaseUrl&&CFG.supabaseUrl.indexOf('YOUR-')<0)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
var TABLES=['models','orders','invoices','stock','settings'];
var DB={models:{},orders:{},invoices:{},stock:{},settings:{}};
var clone=function(v){return JSON.parse(JSON.stringify(v))};
function syncS(){
  S.models=DB.models;S.orders=DB.orders;S.invoices=DB.invoices;S.stock=DB.stock;
  S.settings=DB.settings.main||{};
  S.acl={};S.requests={};
  ['models','stock','orders','invoices','acl','requests'].forEach(function(n){S.loaded[n]=true});
  schedule();
}
async function loadTable(t){
  var r=await sb.from(t).select('id,data');if(r.error)throw r.error;
  var o={};r.data.forEach(function(row){o[row.id]=row.data});DB[t]=o;
}
async function loadAll(){await Promise.all(TABLES.map(loadTable));syncS()}
// Eski veritabanı arayüzüyle aynı çağrılar, Supabase tabloları üzerinde
function mkDb(){
  async function up(t,id,data){
    var r=await sb.from(t).upsert({id:id,data:data,updated_at:new Date().toISOString()});
    if(r.error)throw r.error;
    DB[t][id]=data;syncS();
  }
  return {
    doc:function(path){
      var p=path.split('/'),t=p[0],id=p.slice(1).join('/');
      return {
        set:function(v){return up(t,id,clone(v))},
        update:function(v){return up(t,id,Object.assign({},DB[t][id]||{},clone(v)))},
        delete:async function(){var r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error;delete DB[t][id];syncS()}
      };
    },
    collection:function(t){
      return {add:async function(v){var id=crypto.randomUUID();await up(t,id,clone(v));return id}};
    }
  };
}
async function run(fn,ok){
  try{await fn();if(ok)toast(ok);return true}
  catch(e){toast((e&&e.message)||'İşlem tamamlanamadı.',true);return false}
}
function loginHTML(){
  return '<div class="center"><form id="login-form" class="card" style="width:100%;max-width:360px;text-align:left">'+
    '<h2 style="margin:0 0 4px">Giriş</h2><p class="muted" style="margin:0 0 14px">Panel şifrenizi girin.</p>'+
    '<div class="fg"><label>Şifre<input name="pass" type="password" autocomplete="current-password" required autofocus></label></div>'+
    '<p id="login-err" style="color:var(--bad,#b42318);min-height:1.2em;margin:8px 0"></p>'+
    '<button class="btn p" type="submit" style="width:100%">Giriş yap</button></form></div>';
}
function showLogin(msg){
  S.db=null;S.isOwner=false;S.me=null;S.uid=null;
  render();
  var e=$('#login-err');if(e&&msg)e.textContent=msg;
}
async function enterSession(){
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){showLogin('');return}
  S.uid=s.data.session.user.id;S.isOwner=true;S.me={name:'Yönetici'};
  S.db=mkDb();
  try{await loadAll()}catch(err){
    await sb.auth.signOut();
    showLogin('Veriler okunamadı: '+((err&&err.message)||'bilinmeyen hata'));
    return;
  }
  render();
}
document.addEventListener('submit',async function(e){
  var f=e.target.closest&&e.target.closest('#login-form');if(!f)return;e.preventDefault();
  var b=f.querySelector('button');if(b)b.disabled=true;
  var r=await sb.auth.signInWithPassword({email:CFG.loginEmail,password:f.elements.pass.value});
  if(r.error){if(b)b.disabled=false;showLogin('Şifre hatalı.');return}
  await enterSession();
});
document.addEventListener('submit',async function(e){
  var f=e.target.closest&&e.target.closest('form[data-form="ownpw"]');if(!f)return;e.preventDefault();
  var pw=(new FormData(f).get('password')||'').toString();
  await run(async function(){
    var r=await sb.auth.updateUser({password:pw});if(r.error)throw r.error;
    closeModal();
  },'Şifreniz değiştirildi');
});
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act="logout"],[data-act="own-pw"]');if(!el)return;
  var a=el.dataset.act;
  if(a==='logout'){await sb.auth.signOut();location.hash='';showLogin('');return}
  openModal('<h2>Şifremi değiştir</h2><form data-form="ownpw"><div class="fg"><label>Yeni şifre (en az 10 karakter)<input name="password" type="password" minlength="10" required></label></div><div class="row" style="margin-top:12px"><button class="btn p" type="submit">Kaydet</button></div></form>');
});
async function boot(){
  if(!sb||!CFG.loginEmail){showLogin('Bağlantı ayarları eksik (config.js).');return}
  await enterSession();
}
boot();

})();
</script>
